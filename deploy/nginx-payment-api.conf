# Host nginx site for the Payment API. Installed once at
# /etc/nginx/sites-available/payment-api (symlinked into sites-enabled).
# HTTPS is added by: sudo certbot --nginx -d pagamentos.168.228.189.196.nip.io
server {
    listen 80;
    server_name pagamentos.168.228.189.196.nip.io;

    client_max_body_size 5m;

    location /temporal/ {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
