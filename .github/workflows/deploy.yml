name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only one deploy at a time; a newer commit waits for the previous one to finish.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  test:
    name: Lint, test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint:check
      - run: npm run test:ci
      - run: npm run build

  image:
    name: Build & push image
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image name (GHCR requires lowercase)
        id: meta
        run: |
          echo "image=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:latest
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

  deploy:
    name: Deploy to server
    # Self-hosted runner installed on the server (label: payment-server). See docs/DEPLOY.md.
    runs-on: [self-hosted, payment-server]
    needs: image
    environment:
      name: production
      url: ${{ vars.APP_PUBLIC_URL }}
    permissions:
      contents: read
      packages: read
    env:
      DEPLOY_DIR: /opt/payment-api
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync deploy files
        run: |
          mkdir -p "$DEPLOY_DIR/temporal-config"
          cp docker-compose.prod.yml "$DEPLOY_DIR/"
          cp deploy/nginx-payment-api.conf "$DEPLOY_DIR/"
          cp temporal-config/*.yaml "$DEPLOY_DIR/temporal-config/"
          cp scripts/deploy.sh "$DEPLOY_DIR/deploy.sh"
          chmod +x "$DEPLOY_DIR/deploy.sh"
          if [ ! -f "$DEPLOY_DIR/.env" ]; then
            echo "::error::$DEPLOY_DIR/.env not found. Create it from .env.production.example"
            exit 1
          fi

      - name: Deploy
        working-directory: /opt/payment-api
        env:
          IMAGE: ${{ needs.image.outputs.image }}
          IMAGE_TAG: ${{ needs.image.outputs.tag }}
        run: ./deploy.sh

      - name: Summary
        run: |
          {
            echo "### Deploy concluído"
            echo "- Imagem: ${{ needs.image.outputs.image }}:${{ needs.image.outputs.tag }}"
            echo "- Commit: ${GITHUB_SHA::12}"
          } >> "$GITHUB_STEP_SUMMARY"
